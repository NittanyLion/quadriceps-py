name: Publish to PyPI
# Runs when a GitHub release is published. Uploads with PyPI trusted publishing
# (OpenID Connect), so no API token is stored anywhere; the `pypi` environment
# and the pending publisher on pypi.org must name this workflow file.
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # the wheel must carry the rules: install it and run the tests against it
      - run: python -m pip install dist/*.whl pytest
      - run: |
          cp -r tests conftest.py "$RUNNER_TEMP"/
          cd "$RUNNER_TEMP" && python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/quadriceps/
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
