[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quadriceps"
version = "0.1.0"
description = "Positive-weight cubature rules for the Gaussian weight and the cube (ghpos, lepos)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Joris Pinkse", email = "pinkse@gmail.com" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/NittanyLion/quadriceps-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quadriceps = ["data/index.tsv", "data/rules.bin"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["src"]
