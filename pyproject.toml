[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quadriceps"
version = "0.1.0"
description = "Positive-weight cubature rules for the Gaussian weight and the cube (ghpos, lepos)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Joris Pinkse", email = "pinkse@gmail.com" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]
lint = ["ruff"]

[project.urls]
Repository = "https://github.com/NittanyLion/quadriceps-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quadriceps = ["data/index.tsv", "data/rules.bin"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP007", "UP045"]      # the docs use π, ², × and friends on purpose
